<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اقتباسات الكتب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#12212b;--mute:#5d6c76;--line:#d5dde2;--acc:#0e6b73;--acc-ink:#fff;--ok:#1b7f4b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a20;--card:#17262e;--ink:#e8eef1;--mute:#93a5af;--line:#28404b;--acc:#4fc3cc;--acc-ink:#062226;--ok:#5fd394}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;line-height:1.7;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
h1{font-family:Amiri,serif;font-size:2rem;margin:8px 0 16px}
.form{display:grid;gap:10px}
input,select{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:var(--acc-ink);font-weight:700}
button:disabled{opacity:.6;cursor:wait}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line);padding:6px 12px;font-weight:500}
details{margin-top:12px;color:var(--mute);font-size:.9rem}
summary{cursor:pointer}
#status{margin:16px 0;color:var(--mute)}
#status.err{color:#c0392b}
.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.q{border-inline-start:4px solid var(--acc)}
.q p{font-family:Amiri,serif;font-size:1.3rem;line-height:1.9;margin:0 0 6px}
.q small{display:block;color:var(--mute);margin-bottom:10px}
.q button.ghost.done{color:var(--ok);border-color:var(--ok)}
[hidden]{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:500}
.tab.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
input[type=file]{padding:10px}
</style>
</head>
<body>
<main>
  <h1>اقتباسات من كتاب</h1>
  <div class="tabs"><button class="tab on" id="t1">من ذاكرة النموذج</button><button class="tab" id="t2">من ملف الكتاب</button></div>
  <div class="form">
    <div id="p1" class="form">
      <input id="book" placeholder="اسم الكتاب" autocomplete="off">
      <input id="author" placeholder="اسم المؤلف" autocomplete="off">
    </div>
    <div id="p2" class="form" hidden>
      <input id="file" type="file" accept=".txt,.pdf,.epub">
      <select id="depth" aria-label="العمق">
        <option value="20">سريع: 20 مقطعًا موزعة على الكتاب</option>
        <option value="50">متوسط: 50 مقطعًا</option>
        <option value="0">الكتاب كاملًا (بطيء)</option>
      </select>
    </div>
    <input id="key" type="password" placeholder="مفتاح Groq API (يُطلب في كل مرة ولا يُحفظ)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <select id="model" aria-label="النموذج"><option value="openai/gpt-oss-120b">النموذج: openai/gpt-oss-120b</option></select>
    <button id="go">استخرج 10 اقتباسات</button>
    <button id="stop" class="ghost" hidden>إيقاف</button>
  </div>
  <div id="status" role="status"></div>
  <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const API = "https://api.groq.com/openai/v1/chat/completions";
let quotes = [], meta = "", mode = 1, stopFlag = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function status(msg, err) { $("status").textContent = msg; $("status").className = err ? "err" : ""; }

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } catch (_) {} t.remove();
  }
  const old = btn.textContent; btn.textContent = "تم النسخ"; btn.classList.add("done");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1500);
}

function render() {
  const out = $("out"); out.innerHTML = "";
  if (!quotes.length) return;
  const bar = document.createElement("div"); bar.className = "bar";
  bar.innerHTML = "<span>" + meta + "</span>";
  const all = document.createElement("button"); all.className = "ghost"; all.textContent = "نسخ الكل";
  all.onclick = () => copy(quotes.map((q, i) => (i + 1) + ". " + q.quote).join("\n\n") + "\n\n— " + meta, all);
  bar.appendChild(all); out.appendChild(bar);
  quotes.forEach(q => {
    const d = document.createElement("div"); d.className = "q";
    const p = document.createElement("p"); p.dir = "auto"; p.textContent = q.quote; d.appendChild(p);
    const nt = [q.note, q.confidence === "approx" && !/الصياغة/.test(q.note || "") ? "قد تختلف الصياغة عن النص الأصلي" : ""].filter(Boolean).join(" — ");
    if (nt) { const s = document.createElement("small"); s.textContent = nt; d.appendChild(s); }
    const b = document.createElement("button"); b.className = "ghost"; b.textContent = "نسخ";
    b.onclick = () => copy(q.quote + "\n— " + meta, b);
    d.appendChild(b); out.appendChild(d);
  });
}

$("key").addEventListener("change", async () => {
  const key = $("key").value.trim(); if (!key) return;
  try {
    const r = await fetch("https://api.groq.com/openai/v1/models", { headers: { "Authorization": "Bearer " + key } });
    if (!r.ok) return;
    const ids = (await r.json()).data.map(m => m.id).filter(id => !/whisper|tts|orpheus|guard|embed|safeguard/i.test(id)).sort();
    if (!ids.length) return;
    const sel = $("model"), cur = sel.value; sel.innerHTML = "";
    ids.forEach(id => { const o = document.createElement("option"); o.value = id; o.textContent = "النموذج: " + id; sel.appendChild(o); });
    sel.value = ids.includes(cur) ? cur : ids[0];
  } catch (e) {}
});


async function chat(prompt, key, model, temp) {
  for (let n = 0; n < 6; n++) {
    if (stopFlag) throw Object.assign(new Error("stopped"), { name: "Stopped" });
    const timeout = new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error("timeout"), { name: "TimeoutError" })), 60000));
    const r = await Promise.race([timeout, fetch(API, {
      method: "POST",
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify({ model, temperature: temp, messages: [{ role: "user", content: prompt }] })
    })]);
    if (r.ok) return (await r.json()).choices[0].message.content || "";
    let m = ""; try { m = (await r.json()).error.message; } catch (_) {}
    if (r.status === 429) {
      if (/per day|TPD/i.test(m)) throw new Error("انتهى الحد اليومي لحسابك في Groq. أعد المحاولة لاحقًا أو اختر عددًا أقل من المقاطع.");
      const x = /try again in ([\d.]+)(ms|s|m)/.exec(m); let w = 15000;
      if (x) w = parseFloat(x[1]) * (x[2] === "ms" ? 1 : x[2] === "s" ? 1000 : 60000) + 1000;
      status("بلغتَ حد السرعة في Groq، انتظار " + Math.ceil(w / 1000) + " ثانية...");
      await sleep(Math.min(w, 90000)); continue;
    }
    throw new Error(r.status === 401 ? "المفتاح غير صحيح (401)" : "خطأ " + r.status + (m ? ": " + m : ""));
  }
  throw new Error("تعذّر الإكمال بسبب حدود السرعة. جرّب عددًا أقل من المقاطع.");
}
function parseJSON(raw) {
  const a = raw.indexOf("{"), b = raw.lastIndexOf("}");
  if (a < 0 || b < 0) return null;
  try { return JSON.parse(raw.slice(a, b + 1)); } catch (e) { return null; }
}
const pick = (arr, n) => n && arr.length > n ? Array.from({ length: n }, (_, i) => arr[Math.floor(i * arr.length / n)]) : arr;
const norm = t => t.toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g, "").replace(/[إأآ]/g, "ا").replace(/[\s.,،؛:!?؟"'«»()\-–—]/g, "");

function setMode(m) {
  mode = m; $("t1").classList.toggle("on", m === 1); $("t2").classList.toggle("on", m === 2);
  $("p1").hidden = m !== 1; $("p2").hidden = m !== 2;
  $("go").textContent = m === 1 ? "استخرج 10 اقتباسات" : "استخرج الاقتباسات من الملف";
}
$("t1").onclick = () => setMode(1); $("t2").onclick = () => setMode(2);

/* ---- من ذاكرة النموذج ---- */
async function runMemory(book, author, key, model) {
  const FORMAT = 'أعد JSON فقط بهذا الشكل: {"quotes":[{"quote":"...","confidence":"high","note":"سياق قصير اختياري"}]}';
  const p1 = `أنت خبير في الأدب العربي والعالمي. أعطني حتى 10 اقتباسات جميلة من كتاب "${book}" للمؤلف "${author}".
القواعد:
- اكتب الاقتباس بلغة الكتاب الأصلية؛ إن كان الكتاب عربيًا فاكتبه بالفصحى.
- اذكر ما تتذكره من نصوص الكتاب أو من العبارات المشهورة المنسوبة إليه، ولا تختلق أسماء أو أحداثًا.
- confidence: "high" إن كنت واثقًا من النص حرفيًا، و"approx" إن كنت واثقًا من المعنى ونسبته إلى الكتاب لكن الصياغة قد تختلف.
- لا تعد قائمة فارغة إلا إذا كنت لا تعرف هذا الكتاب إطلاقًا. وإن عرفته فأعد ما تستطيع ولو 3 اقتباسات.
- كل اقتباس جملة أو جملتان.
` + FORMAT;
  const p2 = `الكتاب "${book}" للمؤلف "${author}" كتاب معروف. اذكر أبرز الأفكار والعبارات التي اشتهر بها، في صورة اقتباسات قصيرة بلغته الأصلية، بأقرب صياغة تتذكرها. اجعل confidence دائمًا "approx" ولا تختلق أحداثًا غير موجودة في الكتاب.
` + FORMAT;
  const get = async p => { const j = parseJSON(await chat(p, key, model, 0.4)); return ((j && j.quotes) || []).filter(q => q && q.quote); };
  quotes = await get(p1);
  if (!quotes.length) { status("محاولة ثانية..."); quotes = await get(p2); }
  meta = book + "، " + author;
}

/* ---- من ملف الكتاب ---- */
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.onload = res;
    s.onerror = () => rej(new Error("تعذّر تحميل مكتبة قراءة الملف، تحقق من الإنترنت."));
    document.head.appendChild(s);
  });
}
async function readFile(f) {
  const ext = f.name.split(".").pop().toLowerCase(), buf = await f.arrayBuffer();
  if (ext === "txt") {
    let t = new TextDecoder("utf-8").decode(buf);
    if ((t.match(/\uFFFD/g) || []).length > 20) t = new TextDecoder("windows-1256").decode(buf);
    return t;
  }
  if (ext === "pdf") {
    const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    if (!window.pdfjsLib) { await loadScript(base + "pdf.min.js"); pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; }
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise, out = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      if (i % 5 === 1) status("قراءة الصفحة " + i + " من " + pdf.numPages + "...");
      const c = await (await pdf.getPage(i)).getTextContent();
      out.push(c.items.map(x => x.str).join(" "));
    }
    return out.join("\n").normalize("NFKC");
  }
  if (ext === "epub") {
    if (!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const z = await JSZip.loadAsync(buf), out = [];
    for (const n of Object.keys(z.files).filter(n => /\.(x?html?)$/i.test(n)).sort())
      out.push(new DOMParser().parseFromString(await z.files[n].async("string"), "text/html").body.textContent);
    return out.join("\n");
  }
  throw new Error("صيغة غير مدعومة. استخدم txt أو pdf أو epub.");
}
function chunkText(t) {
  t = t.replace(/\s+/g, " ").trim(); const out = []; let i = 0;
  while (i < t.length) {
    let e = Math.min(i + 5000, t.length);
    if (e < t.length) { const k = Math.max(t.lastIndexOf(". ", e), t.lastIndexOf("؟ ", e), t.lastIndexOf("! ", e)); if (k > i + 3000) e = k + 1; }
    const c = t.slice(i, e).trim(); if (c.length > 500) out.push(c); i = e;
  }
  return out;
}
async function runFile(key, model) {
  const f = $("file").files[0];
  status("قراءة الملف...");
  const text = await readFile(f);
  if (text.replace(/\s/g, "").length < 2000) throw new Error("لم أستطع استخراج نص كافٍ من الملف (قد يكون صورًا ممسوحة ضوئيًا).");
  const chunks = pick(chunkText(text), +$("depth").value), cands = [];
  for (let i = 0; i < chunks.length && !stopFlag; i++) {
    status("تحليل المقطع " + (i + 1) + " من " + chunks.length + " (مرشّح حتى الآن: " + cands.length + ")");
    try {
      const raw = await chat(`النص التالي مقطع من كتاب. اختر منه حتى جملتين هما الأجمل والأعمق، بحيث تصلح كل منهما اقتباسًا مستقلًا مفهومًا دون سياق (بين 40 و250 حرفًا). انسخ كل جملة حرفيًا كما هي في النص دون أي تعديل أو اختصار. إن لم تجد شيئًا جديرًا فأعد قائمة فارغة.
أعد JSON فقط: {"quotes":["..."]}

النص:
` + chunks[i], key, model, 0);
      const j = parseJSON(raw), nc = norm(chunks[i]);
      ((j && j.quotes) || []).forEach(q => { if (typeof q === "string" && q.length >= 30 && q.length <= 400 && nc.includes(norm(q))) cands.push(q.trim()); });
    } catch (e) { if (e.name === "Stopped") break; if (e.name === "TimeoutError") continue; throw e; }
  }
  if (!cands.length) throw new Error("لم أحصل على اقتباسات مطابقة لنص الكتاب. جرّب نموذجًا آخر أو ملفًا أوضح.");
  let final = pick(cands, 10);
  if (cands.length > 10) {
    status("اختيار أجمل 10 اقتباسات...");
    stopFlag = false;
    const pool = pick(cands, 80);
    try {
      const j = parseJSON(await chat("هذه اقتباسات من كتاب. اختر أجمل 10 منها (الأعمق معنى والأجمل صياغة والأوضح دون سياق)، ولا تكرر فكرة واحدة. أعد JSON فقط: {\"picks\":[أرقام]}\n\n" + pool.map((q, i) => (i + 1) + ". " + q).join("\n"), key, model, 0));
      const sel = [...new Set(((j && j.picks) || []).map(n => pool[n - 1]).filter(Boolean))].slice(0, 10);
      if (sel.length) final = sel;
    } catch (e) {}
  }
  quotes = final.map(q => ({ quote: q, note: "نص حرفي من الكتاب" }));
  meta = f.name.replace(/\.[^.]+$/, "");
}

$("go").onclick = async () => {
  const key = $("key").value.trim(), model = $("model").value;
  if (!key) return status("أدخل مفتاح Groq API.", true);
  const book = $("book").value.trim(), author = $("author").value.trim();
  if (mode === 1 && (!book || !author)) return status("أدخل اسم الكتاب واسم المؤلف.", true);
  if (mode === 2 && !$("file").files[0]) return status("اختر ملف الكتاب أولًا.", true);
  stopFlag = false; $("go").disabled = true; $("stop").hidden = mode !== 2; quotes = []; render(); status("جارٍ العمل...");
  try {
    if (mode === 1) await runMemory(book, author, key, model); else await runFile(key, model);
    if (!quotes.length) status("لم يتعرّف النموذج على هذا الكتاب. جرّب كتابة الاسم كما هو مشهور، أو استخدم «من ملف الكتاب».");
    else { status(mode === 1 ? "تحقق من الاقتباسات من الكتاب نفسه، فالنماذج قد تخطئ." : "اقتباسات حرفية تم التحقق من وجودها في نص الكتاب."); render(); }
  } catch (e) {
    status(e.name === "TimeoutError" ? "انتهت المهلة. تحقق من الإنترنت ثم أعد المحاولة." : "تعذّر الاستخراج: " + e.message, true);
  } finally { $("go").disabled = false; $("stop").hidden = true; }
};
$("stop").onclick = () => { stopFlag = true; status("جارٍ الإيقاف وعرض ما تم استخراجه..."); };
</script>
</body>
</html>
